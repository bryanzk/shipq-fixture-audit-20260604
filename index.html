  <script>
    const statusEl = document.getElementById('status');
    const decoder = new TextDecoder();
    function fromBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }
    async function sha256Hex(bytes) {
      const digest = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    async function decrypt(password) {
      const payload = JSON.parse(document.getElementById('encryptedPayload').textContent);
      const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromBase64(payload.salt), iterations: payload.iterations, hash: 'SHA-256' }, keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const encrypted = new Uint8Array([...fromBase64(payload.ciphertext), ...fromBase64(payload.tag)]);
      const plaintext = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(payload.iv) }, key, encrypted));
      const actualHash = await sha256Hex(plaintext);
      if (actualHash !== payload.plaintext_sha256) throw new Error('Decrypted content failed integrity check.');
      return decoder.decode(plaintext);
    }
    document.getElementById('unlockForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.className = 'status';
      statusEl.textContent = 'Decrypting...';
      try {
        const rawPassword = document.getElementById('password').value;
        const trimmedPassword = rawPassword.trim();
        const candidates = trimmedPassword && trimmedPassword !== rawPassword ? [rawPassword, trimmedPassword] : [rawPassword];
        let html;
        let lastError;
        for (const candidate of candidates) {
          try {
            html = await decrypt(candidate);
            break;
          } catch (error) {
            lastError = error;
          }
        }
        if (!html) throw lastError;
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        statusEl.className = 'status error';
        statusEl.textContent = 'Invalid unlock password. Use the page unlock password, not the audit sync password.';
      }
    });
